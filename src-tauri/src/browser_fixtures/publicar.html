<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Página de teste: publicar</title>
</head>
<body>
  <main>
    <h1>Publicar texto</h1>
    <form id="formulario-publicar">
      <label for="texto">Texto</label>
      <textarea id="texto" name="texto" rows="6"></textarea>
      <button type="button" id="botao-publicar">Publicar</button>
    </form>
    <p id="resultado" aria-live="polite"></p>
  </main>
</body>
</html>
