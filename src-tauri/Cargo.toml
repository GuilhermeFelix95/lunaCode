[package]
name = "lunacode"
version = "0.4.0"
edition = "2021"

[lib]
name = "lunacode"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "image-png" liga Image::from_bytes, usado para definir o ícone da janela na inicialização.
tauri = { version = "2", features = ["unstable", "image-png"] }
tauri-plugin-dialog = "2"
# Avisos do sistema quando a janela não está em foco (resposta pronta, erro, plano).
tauri-plugin-notification = "=2.5.1"
portable-pty = "0.9"
keyring = "4.2.0"
# Marketplace de plugins: confere o sha256 de cada arquivo e baixa catálogos por HTTPS (TLS com rustls).
sha2 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Imagens anexadas: o Claude recebe o arquivo em base64 no stdin.
base64 = "0.22.1"
toml_edit = "0.25.17"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
# Só para ligar o salvamento de senha do WebView2 (ICoreWebView2Profile6) nas abas do navegador.
webview2-com = "0.39.1"
windows-core = "0.62.2"
